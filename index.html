<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Прогресс по работе</title>
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f3efe6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Работа" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css?v=11" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <h1>Прогресс по работе</h1>
      </div>
      <div class="controls">
        <button class="install-banner hidden" id="btn-install" type="button">Установить на телефон</button>
        <label class="norm">Норма <input id="norm" type="number" min="1" step="1" value="200" /> / день</label>
        <div class="nav">
          <button id="prev-month" type="button" aria-label="Предыдущий месяц">‹</button>
          <strong id="month-label">Сентябрь 2026</strong>
          <button id="next-month" type="button" aria-label="Следующий месяц">›</button>
        </div>
      </div>
    </header>

    <main id="view-month">
      <article class="card">
        <p class="kicker">Итог месяца</p>
        <p class="ratio" id="ratio">0<span>/0</span></p>
        <div class="status wait" id="status">Пров. в день: 0</div>
        <div class="bar" aria-hidden="true"><i id="bar"></i></div>
        <div class="meta">
          <span>Сумма <b id="sum">0</b></span>
          <span>План <b id="plan">0</b></span>
          <span>В зачёте <b id="counted">0</b></span>
          <span>Пустых <b id="empty">0</b></span>
          <span>Выходных <b id="weekends">0</b></span>
          <span>Прочерки <b id="offs">0</b></span>
        </div>
      </article>
      <section class="card" style="margin-top:16px">
        <div class="side-title">
          <p class="kicker">Дни</p>
          <span class="note" style="margin:0">Число — факт. Прочерк — другая задача, не в плане.</span>
        </div>
        <div class="days" id="days"></div>
      </section>
    </main>

    <main class="hidden" id="view-more">
      <article class="card">
        <div class="side-title">
          <p class="kicker">По дням к норме</p>
          <span class="note" id="chart-hint" style="margin:0"></span>
        </div>
        <div class="chart" id="chart"></div>
        <div class="footer-actions">
          <button class="ghost" id="weekends" type="button">Выходные как «-»</button>
          <button class="ghost" id="export" type="button">Скачать JSON</button>
          <button class="ghost" id="import" type="button">Загрузить JSON</button>
          <button class="primary" id="reset-month" type="button">Сбросить месяц</button>
          <button class="ghost" id="reset-all" type="button">Сбросить всё</button>
        </div>
      </article>
    </main>
  </div>
  <nav class="tabbar">
    <button class="tab active" data-view="month" type="button">Месяц</button>
    <button class="tab" data-view="more" type="button">Ещё</button>
  </nav>
  <div class="sheet hidden" id="sheet">
    <button class="sheet-backdrop" id="sheet-close" type="button" aria-label="Закрыть"></button>
    <div class="sheet-panel"><div class="sheet-handle"></div><div id="sheet-body"></div></div>
  </div>
  <input id="import-file" class="hidden" type="file" accept="application/json" />
  <script src="app.js?v=11"></script>
</body>
</html>
