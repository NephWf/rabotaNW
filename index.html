<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Прогресс по работе</title>
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f3efe6" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Работа" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">Работа</p>
        <h1 id="page-title">Месяц</h1>
      </div>
    </header>
    <button class="install-banner hidden" id="btn-install" type="button">Установить на телефон</button>
    <section class="date-row">
      <button class="icon-btn ghost" id="prev-month" type="button" aria-label="Предыдущий месяц">‹</button>
      <strong id="month-label">Октябрь 2026</strong>
      <button class="icon-btn ghost" id="next-month" type="button" aria-label="Следующий месяц">›</button>
    </section>
    <main class="content" id="view-month"></main>
    <main class="content hidden" id="view-days"></main>
    <main class="content hidden" id="view-stats"></main>
    <main class="content hidden" id="view-more"></main>
    <nav class="tabbar">
      <button class="tab active" data-view="month" type="button"><span>▣</span>Месяц</button>
      <button class="tab" data-view="days" type="button"><span>☰</span>Дни</button>
      <button class="tab" data-view="stats" type="button"><span>▤</span>Сводка</button>
      <button class="tab" data-view="more" type="button"><span>●</span>Ещё</button>
    </nav>
  </div>
  <div class="sheet hidden" id="sheet">
    <div class="sheet-backdrop" id="sheet-close"></div>
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <div id="sheet-body"></div>
    </div>
  </div>
  <input id="import-file" class="hidden" type="file" accept="application/json" />
  <script src="app.js"></script>
</body>
</html>
